<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Editoras - BiblioTech</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=2.3">
    <style>
        /* Estilos para o Modal de Edição */
        .modal-simples {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none; 
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateY(-30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 2px solid #eee;
            border-radius: 10px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="container nav-flex">
            <div class="logo"><i class="fas fa-book-reader"></i> Biblio<span>Tech</span></div>
            <ul class="menu">
                <li><a href="index.html">Início</a></li>
                <li><a href="livros.html">Livros</a></li>
                <li><a href="autores.html">Autores</a></li>
                <li><a href="editoras.html" class="active">Editoras</a></li>
                <li><a href="usuarios.html">Leitores</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="dashboard-content">
            <div class="action-box">
                <h2><i class="fas fa-building"></i> Nova Editora</h2>
                <form id="form-editora">
                    <div class="form-group">
                        <label>Nome da Editora</label>
                        <input type="text" id="nome-editora" required placeholder="Ex: Companhia das Letras">
                    </div>
                    <div class="form-group">
                        <label>Localização (Cidade/País)</label>
                        <input type="text" id="local-editora" placeholder="Ex: São Paulo, Brasil">
                    </div>
                    <button type="submit" class="btn btn-save" style="width: 100%; border: none; cursor: pointer;">
                        <i class="fas fa-plus"></i> Registrar Editora
                    </button>
                </form>
            </div>

            <div class="list-box">
                <h2><i class="fas fa-th-list"></i> Editoras Parceiras</h2>
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>Editora</th>
                            <th>Localização</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-editoras">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="modalEditarEditora" class="modal-simples">
        <div class="modal-content">
            <h3 style="margin-bottom: 15px;"><i class="fas fa-edit"></i> Editar Editora</h3>
            <form id="form-editar-editora">
                <input type="hidden" id="edit-id"> <div class="form-group">
                    <label>Nome da Editora</label>
                    <input type="text" id="edit-nome" required>
                </div>
                
                <div class="form-group" style="margin-top: 15px;">
                    <label>Localização</label>
                    <input type="text" id="edit-local">
                </div>
                
                <div style="display: flex; gap: 10px; margin-top: 25px;">
                    <button type="submit" class="btn btn-save" style="flex: 2; border: none; cursor: pointer;">
                        Salvar Alterações
                    </button>
                    <button type="button" onclick="fecharModal('modalEditarEditora')" class="btn btn-outline" style="flex: 1; cursor: pointer;">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/editoras.js"></script>
</body>
</html>
