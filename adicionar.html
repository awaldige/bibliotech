<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Livro - BiblioTech</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=2.1">
</head>
<body>

    <nav class="top-nav">
        <div class="container nav-flex">
            <div class="logo">
                <i class="fas fa-book-reader"></i> Biblio<span>Tech</span>
            </div>
            <ul class="menu">
                <li><a href="index.html">Início</a></li>
                <li><a href="livros.html" class="active">Livros</a></li>
                <li><a href="usuarios.html">Leitores</a></li>
                <li><a href="config.html"><i class="fas fa-cog"></i></a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="action-box" style="max-width: 800px; margin: 0 auto;">
            <h2><i class="fas fa-plus-circle"></i> Cadastrar Novo Livro</h2>
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

            <form id="form-adicionar-livro">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>Título do Livro</label>
                        <input type="text" name="titulo" required placeholder="Ex: Dom Casmurro">
                    </div>
                    <div class="form-group">
                        <label>ISBN</label>
                        <input type="text" name="isbn" placeholder="978-0000000000">
                    </div>
                    
                    <div class="form-group">
                        <label>Autor</label>
                        <select name="id_autor" id="select-autor" required>
                            <option value="">Carregando autores...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Editora</label>
                        <select name="id_editora" id="select-editora" required>
                            <option value="">Carregando editoras...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Ano de Publicação</label>
                        <input type="number" name="ano_publicacao" min="1500" max="2026">
                    </div>
                    <div class="form-group">
                        <label>Quantidade de Exemplares</label>
                        <input type="number" name="quantidade" value="1" min="1">
                    </div>
                </div>

                <div style="margin-top: 30px; display: flex; gap: 15px;">
                    <button type="submit" class="btn btn-save" style="flex: 2; cursor: pointer;">
                        <i class="fas fa-check"></i> Salvar Livro
                    </button>
                    <a href="livros.html" class="btn btn-outline" style="flex: 1;">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

    <script src="js/adicionar_livro.js"></script>
</body>
</html>
