<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Acervo de Livros - BiblioTech</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .modal-simples { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; }
    </style>
</head>
<body>
    <nav class="top-nav">
        <div class="container nav-flex">
            <div class="logo"><i class="fas fa-book-reader"></i> Biblio<span>Tech</span></div>
            <ul class="menu">
                <li><a href="index.html">Início</a></li>
                <li><a href="livros.html" class="active">Livros</a></li>
                <li><a href="usuarios.html">Leitores</a></li>
                <li><a href="listar_emprestimos.html">Empréstimos</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 30px;">
            <h2><i class="fas fa-book"></i> Acervo de Livros</h2>
            <a href="adicionar.html" class="btn-add"><i class="fas fa-plus"></i> Novo Livro</a>
        </div>

        <table class="custom-table">
            <thead>
                <tr>
                    <th>Título</th>
                    <th>Autor</th>
                    <th>Qtd</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-livros"></tbody>
        </table>
    </div>

    <div id="modalEditarLivro" class="modal-simples">
        <div class="modal-content">
            <h3>Editar Livro</h3>
            <form id="form-editar-livro">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label>Título</label>
                    <input type="text" id="edit-titulo" required style="width:100%; padding:10px; margin-top:5px;">
                </div>
                <div class="form-group">
                    <label>Quantidade</label>
                    <input type="number" id="edit-qtd" required style="width:100%; padding:10px; margin-top:5px;">
                </div>
                <div style="margin-top:20px; display:flex; gap:10px;">
                    <button type="submit" class="btn-save">Salvar</button>
                    <button type="button" onclick="fecharModal()" class="btn-outline">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/livros.js"></script>
</body>
</html>
